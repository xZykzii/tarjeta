name: Verificación de cuotas

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-y-reglas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias fijadas sin scripts
        run: npm ci --ignore-scripts
      - name: Verificar dominio, seguridad y compatibilidad
        run: npm test
      - name: Comprobar seguimiento generado
        run: npm run seguimiento -- --check
      - name: Revisar avisos nuevos de dependencias
        run: npm run test:dependencias
      - name: Probar reglas solo en emulador
        run: npm run test:reglas

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verificar componentes y compilar sin credenciales
        working-directory: android
        run: bash ./gradlew --no-daemon :core:test :app:testDiagnosticoDebugUnitTest :app:testConectadaDebugUnitTest :app:lintDiagnosticoDebug :app:lintConectadaDebug :app:assembleDiagnosticoDebug :app:assembleConectadaDebug
      - name: Conservar informes de prueba, sin APK ni configuración local
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: informes-android
          retention-days: 7
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
